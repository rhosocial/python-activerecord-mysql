# Codecov status configuration.
#
# The CI uploads one report with the shared `unittests` flag plus the
# interpreter/backend flags.  Status checks read the shared flag explicitly so
# they do not depend on whichever flag Codecov happens to pick as default.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0.2%
        flags:
          - unittests
    patch:
      default:
        target: 75%
        flags:
          - unittests
