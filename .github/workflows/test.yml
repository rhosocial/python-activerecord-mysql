# .github/workflows/test.yml
name: Python Test and Coverage with MySQL

on:
  push:
    branches:
      - main
      - 'release/v**'
      - 'maint/**'
  pull_request:
    branches:
      - main
      - 'release/v**'
      - 'maint/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-python-314-mysql-97:
    name: Run benchmarks with Python 3.14 / MySQL 9.7
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: password
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -ppassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 3318:3306

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install activerecord and testsuite
        run: |
          pip install "rhosocial-activerecord @ git+https://github.com/rhosocial/python-activerecord.git@release/v1.0.0.dev17"
          pip install "rhosocial-activerecord-testsuite @ git+https://github.com/rhosocial/python-activerecord-testsuite.git@release/v1.0.0.dev17"

      - name: Create and test database
        run: |
          pip install mysql-connector-python
          python -c "
          import mysql.connector
          conn = mysql.connector.connect(
              host='127.0.0.1',
              port=3318,
              user='root',
              password='password',
              ssl_disabled=True
          )
          cursor = conn.cursor()
          cursor.execute('CREATE DATABASE IF NOT EXISTS test_db CHARACTER SET utf8mb4')
          cursor.execute('SELECT NOW()')
          result = cursor.fetchone()
          print('MySQL 9.7 connectivity test passed - Current time:', result[0])
          cursor.close()
          conn.close()
          "

      - name: Create MySQL scenario config
        run: |
          cat > mysql_scenarios.yaml << EOF
          scenarios:
            mysql_default:
              host: 127.0.0.1
              port: 3318
              database: test_db
              username: root
              password: password
              charset: utf8mb4
              autocommit: true
              ssl_disabled: true
          EOF
          echo "MYSQL_SCENARIOS_CONFIG_PATH=$(pwd)/mysql_scenarios.yaml" >> $GITHUB_ENV

      - name: Run benchmark suite
        run: |
          set -o pipefail
          export PYTHONPATH=src:tests
          TESTSUITE_DIR=$(python - <<'PY'
          import pathlib
          import rhosocial.activerecord.testsuite as testsuite

          print(pathlib.Path(testsuite.__file__).parent)
          PY
          )
          python -m pytest \
            --rootdir=. \
            --confcutdir=. \
            "$TESTSUITE_DIR/benchmark/crud/test_delete_async.py" \
            "$TESTSUITE_DIR/benchmark/crud/test_delete.py" \
            "$TESTSUITE_DIR/benchmark/crud/test_insert_async.py" \
            "$TESTSUITE_DIR/benchmark/crud/test_insert.py" \
            "$TESTSUITE_DIR/benchmark/crud/test_query_async.py" \
            "$TESTSUITE_DIR/benchmark/crud/test_query.py" \
            "$TESTSUITE_DIR/benchmark/crud/test_update_async.py" \
            "$TESTSUITE_DIR/benchmark/crud/test_update.py" \
            "$TESTSUITE_DIR/benchmark/query" \
            "$TESTSUITE_DIR/benchmark/transaction" \
            "$TESTSUITE_DIR/benchmark/mixin" \
            -m benchmark \
            --benchmark-size=small \
            --benchmark-sort=mean \
            --strict-markers \
            --tb=short | tee benchmark-output.txt
          python -m pytest \
            --rootdir=. \
            --confcutdir=. \
            tests/benchmark/activerecord_bulk \
            -m benchmark \
            --benchmark-size=small \
            --benchmark-sort=mean \
            --strict-markers \
            --tb=short | tee -a benchmark-output.txt
          python -m pytest \
            --rootdir=. \
            --confcutdir=. \
            tests/benchmark/backend \
            -m benchmark \
            --benchmark-size=small \
            --benchmark-sort=mean \
            --strict-markers \
            --tb=short | tee -a benchmark-output.txt

      - name: Run FastAPI benchmark suite
        run: |
          set -o pipefail
          export PYTHONPATH=src:tests
          TESTSUITE_DIR=$(python - <<'PY'
          import pathlib
          import rhosocial.activerecord.testsuite as testsuite

          print(pathlib.Path(testsuite.__file__).parent)
          PY
          )
          python -m pytest \
            --rootdir=. \
            --confcutdir=. \
            "$TESTSUITE_DIR/benchmark/fastapi" \
            -m benchmark_fastapi \
            --benchmark-size=small \
            --benchmark-sort=mean \
            --strict-markers \
            --tb=short | tee fastapi-benchmark-output.txt

      - name: Write benchmark conclusion
        if: always()
        run: |
          {
            echo "## Python 3.14 / MySQL 9.7 Benchmark Conclusion"
            echo
            echo "- Python: 3.14"
            echo "- MySQL: 9.7"
            echo "- Scope: testsuite generic benchmarks + ActiveRecord bulk benchmarks + MySQL backend direct benchmarks"
            echo "- Size: small"
            echo "- Result: benchmark job fails only when benchmark execution or correctness checks fail."
            echo
            echo '```text'
            grep -A 120 "benchmark:" benchmark-output.txt || cat benchmark-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write FastAPI benchmark conclusion
        if: always()
        run: |
          {
            echo "## Python 3.14 / MySQL 9.7 FastAPI Benchmark Conclusion"
            echo
            echo "- Python: 3.14"
            echo "- MySQL: 9.7"
            echo "- Scope: testsuite FastAPI database benchmarks"
            echo "- Size: small"
            echo "- Result: benchmark job fails only when FastAPI benchmark execution or correctness checks fail."
            echo
            echo '```text'
            grep -A 120 "benchmark:" fastapi-benchmark-output.txt || cat fastapi-benchmark-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  test-experimental-python-315:
    name: Python ${{ matrix.python-version }}${{ matrix.freethreaded && 't' || '' }} / MySQL ${{ matrix.mysql-version }} (experimental)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python-version: '3.15.0-rc.1', mysql-version: '9.7', port: 3320, freethreaded: false }
          - { python-version: '3.15.0-rc.1', mysql-version: '9.7', port: 3321, freethreaded: true }

    services:
      mysql:
        image: mysql:${{ matrix.mysql-version }}
        env:
          MYSQL_ROOT_PASSWORD: password
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -ppassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - ${{ matrix.port }}:3306

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}${{ matrix.freethreaded && ' free-threaded' || '' }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          freethreaded: ${{ matrix.freethreaded }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install activerecord and testsuite
        run: |
          pip install "rhosocial-activerecord @ git+https://github.com/rhosocial/python-activerecord.git@release/v1.0.0.dev17"
          pip install "rhosocial-activerecord-testsuite @ git+https://github.com/rhosocial/python-activerecord-testsuite.git@release/v1.0.0.dev17"

      - name: Create and test database
        run: |
          pip install mysql-connector-python
          python -c "
          import mysql.connector
          conn = mysql.connector.connect(
              host='127.0.0.1',
              port=${{ matrix.port }},
              user='root',
              password='password',
              ssl_disabled=True
          )
          cursor = conn.cursor()
          cursor.execute('CREATE DATABASE IF NOT EXISTS test_db CHARACTER SET utf8mb4')
          cursor.execute('SELECT NOW()')
          result = cursor.fetchone()
          print('MySQL ${{ matrix.mysql-version }} connectivity test passed - Current time:', result[0])
          cursor.close()
          conn.close()
          "

      - name: Create MySQL scenario config
        run: |
          cat > mysql_scenarios.yaml << EOF
          scenarios:
            mysql_default:
              host: 127.0.0.1
              port: ${{ matrix.port }}
              database: test_db
              username: root
              password: password
              charset: utf8mb4
              autocommit: true
              ssl_disabled: true
          EOF
          echo "MYSQL_SCENARIOS_CONFIG_PATH=$(pwd)/mysql_scenarios.yaml" >> $GITHUB_ENV

      - name: Run tests
        run: |
          export PYTHONPATH=src:tests
          python -m pytest tests/ -n auto --dist=loadgroup --tb=short -x

  test:
    name: Python ${{ matrix.python-version }} / MySQL ${{ matrix.mysql-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # MySQL 5.6 (EOL 2021-02) and 5.7 (EOL 2023-10) are supported here
          # because the test schema has been narrowed where required: any
          # ``VARCHAR(255)`` UNIQUE/INDEX column in backend tests was shrunk
          # to ``VARCHAR(191)`` (191 * 4 = 764 bytes, under 5.6's 767-byte
          # default ``innodb_large_prefix`` cap). Tests that depend on
          # version-specific behaviour (e.g. ``EXPLAIN PARTITIONS`` row
          # format, ``EXCHANGE PARTITION ... WITH VALIDATION``) are skipped
          # inline for unsupported versions.
          - { python-version: '3.8', mysql-version: '5.6', port: 3306 }
          - { python-version: '3.9', mysql-version: '5.7', port: 3307 }
          - { python-version: '3.10', mysql-version: '8.0', port: 3308 }
          - { python-version: '3.11', mysql-version: '8.4', port: 3309 }
          - { python-version: '3.12', mysql-version: '9.0', port: 3310 }
          - { python-version: '3.13', mysql-version: '9.1', port: 3311 }
          - { python-version: '3.14', mysql-version: '9.2', port: 3312 }
          - { python-version: '3.13t', mysql-version: '9.3', port: 3313 }
          - { python-version: '3.14t', mysql-version: '9.4', port: 3314 }
          - { python-version: '3.14', mysql-version: '9.5', port: 3315 }
          - { python-version: '3.14t', mysql-version: '9.6', port: 3316 }
          - { python-version: '3.13', mysql-version: '9.7', port: 3317 }
          - { python-version: '3.14', mysql-version: '9.7', port: 3318 }

    services:
      mysql:
        image: mysql:${{ matrix.mysql-version }}
        env:
          MYSQL_ROOT_PASSWORD: password
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -ppassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - ${{ matrix.port }}:3306

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install activerecord and testsuite
        run: |
          pip install "rhosocial-activerecord @ git+https://github.com/rhosocial/python-activerecord.git@release/v1.0.0.dev17"
          pip install "rhosocial-activerecord-testsuite @ git+https://github.com/rhosocial/python-activerecord-testsuite.git@release/v1.0.0.dev17"

      - name: Create and test database
        run: |
          pip install mysql-connector-python
          python -c "
          import mysql.connector
          conn = mysql.connector.connect(
              host='127.0.0.1',
              port=${{ matrix.port }},
              user='root',
              password='password',
              ssl_disabled=True
          )
          cursor = conn.cursor()
          cursor.execute('CREATE DATABASE IF NOT EXISTS test_db CHARACTER SET utf8mb4')
          cursor.execute('SELECT NOW()')
          result = cursor.fetchone()
          print('MySQL ${{ matrix.mysql-version }} connectivity test passed - Current time:', result[0])
          cursor.close()
          conn.close()
          "

      - name: Create MySQL scenario config
        run: |
          cat > mysql_scenarios.yaml << EOF
          scenarios:
            mysql_default:
              host: 127.0.0.1
              port: ${{ matrix.port }}
              database: test_db
              username: root
              password: password
              charset: utf8mb4
              autocommit: true
              ssl_disabled: true
          EOF
          echo "MYSQL_SCENARIOS_CONFIG_PATH=$(pwd)/mysql_scenarios.yaml" >> $GITHUB_ENV

      - name: Run tests (skip for MySQL 9.6)
        if: matrix.mysql-version != '9.6'
        run: |
          export PYTHONPATH=src:tests
          python -m pytest tests/ -n auto --dist=loadgroup --tb=short -x

      - name: Run tests with coverage (only for MySQL 9.6)
        if: matrix.mysql-version == '9.6'
        run: |
          export PYTHONPATH=src:tests
          pip install codecov
          python -m pytest tests/ -n auto --dist=loadgroup --cov=src --cov-branch --cov-report=xml --tb=short

      - name: Upload coverage to Codecov
        if: matrix.mysql-version == '9.6'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests,python-${{ matrix.python-version }},mysql-${{ matrix.mysql-version }}
          name: codecov-mysql-${{ matrix.python-version }}-${{ matrix.mysql-version }}
          fail_ci_if_error: false